version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: velloe-postgres
    restart: always
    environment:
      POSTGRES_DB: velloe
      POSTGRES_USER: velloe
      POSTGRES_PASSWORD: velloe_password
    ports:
      - "5432:5432"
    volumes:
      - velloe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velloe -d velloe"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: velloe-jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "14268:14268" # Jaeger HTTP collector
      - "14250:14250" # Jaeger gRPC collector

volumes:
  velloe_pgdata:
