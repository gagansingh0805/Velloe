server:
  port: 8080

spring:
  application:
    name: main-service
  datasource:
    url: jdbc:postgresql://localhost:5432/velloe
    username: velloe
    password: velloe_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
